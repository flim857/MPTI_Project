<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ffd700;
            font-weight: 500;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        input:disabled {
            background: rgba(20, 20, 35, 0.5);
            color: rgba(255, 255, 255, 0.6);
        }
        .text-muted {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
            display: block;
        }
        .btn-save {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: #1a1a2e;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Редактирование профиля</h2>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" value="{{ user.username }}" disabled>
                <span class="text-muted">Имя пользователя нельзя изменить</span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <button type="submit" class="btn-save">Сохранить изменения</button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="btn-back">Назад в личный кабинет</a>
    </div>
</body>
</html>
