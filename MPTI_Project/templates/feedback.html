<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ffd700;
            font-weight: 500;
            margin-bottom: 8px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ffd700;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .btn-submit {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: #1a1a2e;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .alert-danger {
            background: rgba(220, 53, 69, 0.9);
            color: white;
        }
        .alert-success {
            background: rgba(6, 214, 160, 0.9);
            color: white;
        }
        .nav-link {
            text-align: center;
            margin-top: 20px;
        }
        .nav-link a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Обратная связь</h1>
        <div class="subtitle">Напишите нам, мы обязательно ответим!</div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Сообщение</label>
                <textarea name="message" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Отправить сообщение</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn-back">На главную</a>
    </div>
</body>
</html>
