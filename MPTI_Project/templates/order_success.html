<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .success-container {
            background: rgba(30, 30, 46, 0.95);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h2 {
            color: #ffd700;
            margin-bottom: 20px;
        }
        p {
            color: white;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border: none;
            padding: 12px 30px;
            color: #1a1a2e;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 12px 30px;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon"></div>
        <h2>Заказ оформлен!</h2>
        <p>Товар <strong>"{{ product_name }}"</strong> успешно заказан.<br>Спасибо за покупку!</p>
        <div class="btn-group">
            <a href="{{ url_for('index') }}" class="btn-primary">На главную</a>
            <a href="{{ url_for('dashboard') }}" class="btn-secondary">История заказов</a>
        </div>
    </div>
</body>
</html>
