<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ffd700;
            font-weight: 500;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        .btn-login {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            color: #1a1a2e;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        .register-link a {
            color: #ffd700;
            text-decoration: none;
        }
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Вход в аккаунт</h2>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Имя пользователя или Email</label>
                <input type="text" name="username_or_email" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">Войти</button>
        </form>

        <div class="register-link">
            Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
